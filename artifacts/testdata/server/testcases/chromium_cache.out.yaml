# Search inside the decoded bodies.
Query: SELECT URL, TopFrameSite, Body FROM Artifact.Generic.Applications.Chrome.Cache( CacheGlobs="Glob\n" + srcDir + "/artifacts/testdata/files/chromium_cache/*", Accessor="file", BodyRegex="training_allowed[^,]*true")
