# Decode br, gzip, zstd and identity bodies.
Query: SELECT URL, Headers, Body, BodyStatus FROM Artifact.Generic.Applications.Chrome.Cache( CacheGlobs="Glob\n" + srcDir + "/artifacts/testdata/files/chromium_cache/*", Accessor="file", IncludeBody=TRUE, URLRegex="chatgpt|example.net|robots") ORDER BY URL
