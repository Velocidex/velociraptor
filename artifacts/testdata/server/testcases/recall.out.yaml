 }
]

# Query OCR text recognition search
Query: SELECT WindowTitle, OcrText FROM Artifact.Windows.Forensics.Recall( RecallGlob=srcDir+"/artifacts/testdata/files/recall/ukg.db", Accessor="file", source="TextSearch", SearchRegex="Malware")
Output: [
