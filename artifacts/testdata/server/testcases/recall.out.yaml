# Validate database storage files and sidecars
Query: SELECT StorageStatus, OSPath.Basename AS Filename, Size > 0 AS HasSize FROM Artifact.Windows.Forensics.Recall( RecallGlob=srcDir+"/artifacts/testdata/files/recall/ukg.db*", Accessor="file", source="StorageValidation")
Output: [
 {
  "Filename": "ukg.db",
  "HasSize": true,
  "StorageStatus": "SQLite Header Detected"
 },
 {
  "Filename": "ukg.db-wal",
  "HasSize": true,
  "StorageStatus": "SQLite Sidecar (WAL/SHM)"
 }
]

# Query window capture records
Query: SELECT CaptureTime, WindowTitle, ImageToken FROM Artifact.Windows.Forensics.Recall( RecallGlob=srcDir+"/artifacts/testdata/files/recall/ukg.db", Accessor="file", source="WindowCaptures")
Output: [
 {
  "CaptureTime": "2020-09-13T12:26:40Z",
