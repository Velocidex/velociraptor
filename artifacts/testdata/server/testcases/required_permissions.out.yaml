# Create a reader user with the collect_server permission - they are
# allowed to collect artifacts on the server.
Query: LET _ <= user_create(user="Reader", roles="reader") AND user_create(user="Admin", roles="administrator") AND artifact_set(definition=ServerArtifact) AND artifact_set(definition=ClientArtifact) AND user_grant(user="Reader", policy=dict(roles=['reader',], collect_client=TRUE, collect_server=TRUE)) AND client_create(client_id=ClientId)
Output: []

# The reader user can still not schedule this artifact on the server
# because they lack the COLLECT_BASIC permission which is required
# by the artifact.
Query: SELECT * FROM query(query={ SELECT whoami(), collect_client( client_id="server", artifacts="BasicServerArtifact").flow_id FROM scope() }, runas="Reader")
Output: [
 {
  "whoami()": "Reader",
  "collect_client(client_id=\"server\", artifacts=\"BasicServerArtifact\").flow_id": null
 }
]

Query: SELECT * FROM test_read_logs() WHERE Log =~ "PermissionDenied. While collecting artifact .+ COLLECT_BASIC" AND NOT Log =~ "SELECT"
Output: [
 {
  "Log": "Velociraptor: collect_client: PermissionDenied: While collecting artifact (BasicServerArtifact) permission denied COLLECT_BASIC\n"
 }
]

# Give the reader the COLLECT_BASIC permission as well
Query: SELECT user_grant(user="Reader", policy=dict(roles=['reader',], collect_client=TRUE, collect_server=TRUE, collect_basic=TRUE)) FROM scope()
Output: [
 {
  "user_grant(user=\"Reader\", policy=dict(roles=['reader', ], collect_client=TRUE, collect_server=TRUE, collect_basic=TRUE))": "Reader"
 }
]

# Check the user now has collect_basic permission
Query: SELECT name, effective_policy =~ "COLLECT_BASIC", effective_policy FROM gui_users() WHERE name = "Reader"
Output: [
 {
  "name": "Reader",
  "effective_policy =~ \"COLLECT_BASIC\"": true,
  "effective_policy": {
   "read_results": true,
   "collect_client": true,
   "collect_basic": true,
   "collect_server": true
  }
 }
]

# Try to collect that basic artifact again - this should work.
Query: SELECT * FROM query(query={ SELECT whoami(), collect_client( client_id="server", artifacts="BasicServerArtifact").flow_id FROM scope() }, runas="Reader")
Output: [
 {
  "whoami()": "Reader",
  "collect_client(client_id=\"server\", artifacts=\"BasicServerArtifact\").flow_id": "F.01"
 }
]

# Try to collect the client artifacts
Query: SELECT * FROM query(query={ SELECT whoami(), collect_client( client_id=ClientId, artifacts="BasicClientArtifact").flow_id FROM scope() }, runas="Reader", env=dict(ClientId=ClientId))
Output: [
 {
  "whoami()": "Reader",
  "collect_client(client_id=ClientId, artifacts=\"BasicClientArtifact\").flow_id": null
 }
]

# Should be rejected because the user does not have EXECVE
Query: SELECT * FROM test_read_logs() WHERE Log =~ "PermissionDenied. While collecting artifact .+ EXECVE" AND NOT Log =~ "SELECT"
Output: [
 {
  "Log": "Velociraptor: collect_client: PermissionDenied: While collecting artifact (BasicClientArtifact) permission denied EXECVE\n"
 }
]

# Give the reader the EXECVE permission as well
Query: SELECT user_grant(user="Reader", policy=dict(roles=['reader',], collect_client=TRUE, execve=TRUE, collect_server=TRUE, collect_basic=TRUE)) FROM scope()
Output: [
 {
  "user_grant(user=\"Reader\", policy=dict(roles=['reader', ], collect_client=TRUE, execve=TRUE, collect_server=TRUE, collect_basic=TRUE))": "Reader"
 }
]

# Try again should work
Query: SELECT * FROM query(query={ SELECT whoami(), collect_client( client_id=ClientId, artifacts="BasicClientArtifact").flow_id FROM scope() }, runas="Reader", env=dict(ClientId=ClientId))
Output: [
 {
  "whoami()": "Reader",
  "collect_client(client_id=ClientId, artifacts=\"BasicClientArtifact\").flow_id": "F.02"
 }
]

