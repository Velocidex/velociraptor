# An example of using functional functions to mask an IP address
# Convert an IP address to a list of integers
Query: LET IPToInts(IP) = map(items=split(string=IP, sep_string='.'), lambda="x=>int(int=x)")
Output: []

# Mask two lists of integers - note the use of index inside map callback.
Query: LET MaskIPLists(IP, Mask) = map(items=IP, lambda="x, i=>bit_and(a=x, b=Mask[i])")
Output: []

# Join an array of integers into an IP address - note coercing of integers to a string
Query: LET GetNetworkAddress(IP, Mask) = join(array=MaskIPLists(IP=IPToInts(IP=IP), Mask=IPToInts(IP=Mask)), sep=".")
Output: []

# Example use
Query: SELECT GetNetworkAddress(IP=IP, Mask=Mask) AS NetworkAddress FROM scope()
Output: [
 {
  "NetworkAddress": "192.168.1.0"
 }
]

