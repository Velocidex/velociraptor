# Test that reduce works in a group by clause. This reduce function
# is basically the same as sum()
Query: SELECT _value AS Value, reduce(items=_value, lambda="acc, x=>acc + x") AS Total, sum(item=_value) AS Sum FROM parse_json_array(data=_TestList) GROUP BY _value
Output: [
 {
  "Value": 1,
  "Total": 2,
  "Sum": 2
 },
 {
  "Value": 2,
  "Total": 6,
  "Sum": 6
 },
 {
  "Value": 3,
  "Total": 6,
  "Sum": 6
 }
]

