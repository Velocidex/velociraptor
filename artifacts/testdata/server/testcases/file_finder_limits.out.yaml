# Size and relative age boundaries are inclusive. Only accepted files reach
# YARA, hashing and uploading. The relative cutoff is computed once.
Query: SELECT OSPath, Size, Keywords, Hash.SHA256 AS SHA256, Upload.Path AS Uploaded
FROM Artifact.Windows.Search.FileFinder(
  MaxFileSize=100, ModifiedWithinDays=7,
  YaraRule="ascii:match", Calculate_Hash="Y", Upload_File="Y")

Output: [
 {
  "OSPath": "boundary",
  "Size": 100,
  "Keywords": "match",
  "SHA256": "mock-hash",
  "Uploaded": "mock-upload"
 },
 {
  "OSPath": "recent",
  "Size": 100,
  "Keywords": "match",
  "SHA256": "mock-hash",
  "Uploaded": "mock-upload"
 },
 {
  "OSPath": "empty",
  "Size": 0,
  "Keywords": "match",
  "SHA256": "mock-hash",
  "Uploaded": "mock-upload"
 }
]

