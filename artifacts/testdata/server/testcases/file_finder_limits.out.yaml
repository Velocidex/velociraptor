# Invalid limits fail closed before globbing or content access, even when
# content options are enabled. Each invalid parameter is checked separately.
Query: SELECT OSPath FROM Artifact.Windows.Search.FileFinder(
  MaxFileSize=-1, ModifiedWithinDays=7,
  YaraRule="ascii:match", Calculate_Hash="Y", Upload_File="Y")

Output: []

