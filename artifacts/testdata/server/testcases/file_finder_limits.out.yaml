Query: LET MockRows <= SELECT OSPath, Size, IsDir,
    timestamp(epoch=Mtime) AS Mtime,
    timestamp(epoch=Mtime) AS Atime,
    timestamp(epoch=Mtime) AS Btime,
    timestamp(epoch=Mtime) AS Ctime,
    dict(String="rw-rw-rw") AS Mode, dict() AS Data
  FROM foreach(row=[
    dict(OSPath="old", Size=10, Mtime=1699308800, IsDir=FALSE),
    dict(OSPath="boundary", Size=100, Mtime=1699395200, IsDir=FALSE),
    dict(OSPath="recent", Size=100, Mtime=1699481600, IsDir=FALSE),
    dict(OSPath="large", Size=101, Mtime=1699481600, IsDir=FALSE),
    dict(OSPath="empty", Size=0, Mtime=1700000000, IsDir=FALSE),
    dict(OSPath="directory", Size=0, Mtime=1700000000, IsDir=TRUE)
  ])

Output: []

Query: LET _ <= mock(plugin="info", results=dict(OS="windows"))
Output: []

Query: LET _ <= mock(plugin="glob", results=MockRows)
Output: []

Query: LET _ <= mock(function="now", results=1700000000)
Output: []

Query: LET _ <= mock(function="upload", results=dict(Path="mock-upload"))
Output: []

Query: LET _ <= mock(function="hash", results=dict(SHA256="mock-hash"))
Output: []

Query: LET _ <= mock(plugin="yara", results=dict(String=dict(Data="match")))
Output: []

