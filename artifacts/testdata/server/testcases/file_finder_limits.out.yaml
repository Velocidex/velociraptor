# Relative and existing absolute filters intersect. MoreRecentThan and
# ModifiedBefore retain their existing strict boundaries.
Query: SELECT OSPath, Size FROM Artifact.Windows.Search.FileFinder(
  MaxFileSize=100, ModifiedWithinDays=7,
  MoreRecentThan=timestamp(epoch=1699395200),
  ModifiedBefore=timestamp(epoch=1700000000))

Output: [
 {
  "OSPath": "recent",
  "Size": 100
 }
]

