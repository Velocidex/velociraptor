name: Server.Utils.ExportHunt
description: |
  Exports an entire hunt's results to a downloadable zip archive with
  configurable data formatting options.

  Sometimes exporting a hunt through the GUI takes longer than the 10
  minute default time limit. If your hunt exports need more time, you
  can use this artifact instead of the GUI's "prepare download"
  feature.

  Once this artifact is done you should see that the export is
  available as a new download item on the hunt's overview tab.

type: SERVER
parameters:
  - name: TargetHuntId
    description: The hunt ID to export.
  - name: OnlyCombined
    type: bool
    description: Set to only produce a combined export (i.e. do not export individual client flows).
  - name: BaseName
    description: A name to be prepended to the filename.
  - name: Format
    type: choices
    choices:
      - Combined
      - JSON
      - CSV
  - name: Password
    type: bool
    description: |
      If set we use the user's password to encrypt the zip file.

sources:
  - query: |
      LET Base = if(condition=BaseName, then=BaseName + "-", else="")

      LET FormatLookup <= dict(
         Combined="",
         JSON="json",
         CVS="csv")

      LET Result <= stat(accessor="fs", filename=create_hunt_download(
         hunt_id=TargetHuntId,
         only_combined=OnlyCombined,
         password=if(condition=Password,
                     then=user_options(user=whoami()).default_password,
                     else=""),
         wait=TRUE,
         base=Base,
         format=get(item=FormatLookup, field=Format),
         expand_sparse=TRUE))

      SELECT Result.OSPath AS OSPath,
          dict(
            Accessor="fs",
            Components=Result.OSPath.Components,
            Size= Result.Size) AS Preview
      FROM scope()

resources:
  timeout: 6000

column_types:
  - name: Preview
    type: upload_preview
