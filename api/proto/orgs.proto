syntax = "proto3";

package proto;

option go_package = "www.velocidex.com/golang/velociraptor/api/proto";

message OrgRecord {
    string name = 1;
    string nonce = 2;
    string id = 3;

    // True if this org is redirected.
    bool redirected = 5;
    string redirected_org_id = 6;

    // Deprecated do not use
    string org_id = 4;
}
